# ============================================================
# 🏰 OLLAMA-AMD-SETUP — Docker Compose
# Kullanım: docker compose up -d
# ============================================================

services:
  ollama:
    image: ollama/ollama:rocm
    container_name: ollama-amd-service
    restart: unless-stopped
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
      - render
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"  # Sadece lokal + Tailscale
    environment:
      - OLLAMA_HOST=0.0.0.0
      - HSA_OVERRIDE_GFX_VERSION=10.3.0
      - ROCR_VISIBLE_DEVICES=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model çekici - ilk kurulumda modelleri otomatik indirir
  ollama-init:
    image: ollama/ollama:rocm
    container_name: ollama-amd-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      /bin/sh -c "
        echo '🏰 Modeller indiriliyor...';
        ollama pull deepseek-r1:7b &&
        echo '✓ DeepSeek R1 7B';
        ollama pull qwen2.5:3b &&
        echo '✓ Qwen2.5 3B';
        ollama pull qwen2.5:7b &&
        echo '✓ Qwen2.5 7B';
        ollama pull llama3.2:3b &&
        echo '✓ Llama 3.2 3B';
        echo '✅ Tüm modeller hazır!';
      "
    restart: "no"

volumes:
  ollama_data:
    driver: local
